
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Login | Library Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5edf2;
            color: #302631;
        }

        .login-card {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: #fffdf9;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(48, 38, 49, 0.12);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #766b76;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8cbd5;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #b76e99;
            border-color: #b76e99;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #80516f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #68405b;
        }

        .error {
            padding: 10px;
            margin-top: 16px;
            background: #ffebeb;
            color: #a32121;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>Library Management</h1>
        <p class="subtitle">Librarian Login</p>

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
                autocomplete="username"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Login</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
